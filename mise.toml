min_version = "2026.9.0"

[tools]
node = "24.21.0"
pnpm = "12.8.2"

[env]
# Run project binaries (next, vitest, biome, playwright, tsc) directly, without `pnpm exec`.
_.path = ["{{config_root}}/node_modules/.bin"]
_.file = ".env"

[tasks.install]
description = "Install dependencies (frozen lockfile)"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Biome + typecheck, as CI runs them"
run = ["biome ci .", "tsc --noEmit"]

[tasks.test]
description = "Unit tests (vitest)"
run = "vitest run"

[tasks.build]
description = "Production build"
run = "next build"

[tasks.e2e]
description = "Playwright e2e against the production build (run build first)"
run = "playwright test"
